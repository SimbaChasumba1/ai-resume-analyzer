services:
  api:
    image: ai-resume-api:local
    container_name: resume-api
    ports:
      - "5000:8080"
    env_file:
      - ./Backend/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      FRONTEND_ORIGIN: http://localhost:3000
      PythonService__BaseUrl: http://python-service:10000
    depends_on:
      - python-service
    restart: unless-stopped

  worker:
    image: ai-resume-worker:local
    container_name: resume-worker
    env_file:
      - ./Backend/.env
    environment:
      PythonService__BaseUrl: http://python-service:10000
      RabbitMQ__Queue: resume-analysis
    depends_on:
      - python-service
    restart: unless-stopped

  python-service:
    image: ai-resume-python:local
    container_name: resume-python
    ports:
      - "10000:10000"
    env_file:
      - ../python-services/.env
    restart: unless-stopped