name: .NET CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore solution
        run: dotnet restore AIResumeAnalyzer.slnx

      - name: Build solution
        run: dotnet build AIResumeAnalyzer.slnx --configuration Release --no-restore

      - name: Run existing tests
        run: dotnet test AIResumeAnalyzer.slnx --configuration Release --no-build

